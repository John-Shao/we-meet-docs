server {
  listen 8080;
  listen 3000;
  server_name localhost;

  root /app;

  location / {
      try_files $uri index.html $uri/index.html =404;

      # P3 内嵌:经用户显式授权,允许 we-meet(同一注册域 we-meet.online / jusiai.com)在框架内 iframe 打开。
      # 用 CSP frame-ancestors 按来源放行（X-Frame-Options 只能 DENY/SAMEORIGIN，无法按来源）。
      add_header Content-Security-Policy "frame-ancestors 'self' https://meet.we-meet.online https://meet.jusiai.com" always;
  }

  location ~ "^/docs/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/?$" {
      try_files $uri /docs/[id]/index.html;

      # P3 内嵌:经用户显式授权,允许 we-meet(同一注册域 we-meet.online / jusiai.com)在框架内 iframe 打开。
      # 用 CSP frame-ancestors 按来源放行（X-Frame-Options 只能 DENY/SAMEORIGIN，无法按来源）。
      add_header Content-Security-Policy "frame-ancestors 'self' https://meet.we-meet.online https://meet.jusiai.com" always;
  }

  location ~ "^/user-reconciliations/(active|inactive)/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/?$" {
      try_files $uri /user-reconciliations/$1/[id]/index.html;

      # P3 内嵌:经用户显式授权,允许 we-meet(同一注册域 we-meet.online / jusiai.com)在框架内 iframe 打开。
      # 用 CSP frame-ancestors 按来源放行（X-Frame-Options 只能 DENY/SAMEORIGIN，无法按来源）。
      add_header Content-Security-Policy "frame-ancestors 'self' https://meet.we-meet.online https://meet.jusiai.com" always;
  }

  error_page 404 /404.html;
  location = /404.html {
      internal;
  }
}
