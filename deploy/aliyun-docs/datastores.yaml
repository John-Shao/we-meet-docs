# datastores.yaml — Docs 独立机自建 PG + Redis（P3 协作文档）
#
# 用途：在 aliyun-docs（单节点 k3s）本机跑 Docs 专属 PostgreSQL / Redis，与 meet 完全隔离。
#   由 deploy-datastores.sh 读 secrets.env → envsubst 注入密码 → kubectl apply -n docs。
#   ⚠️ 必须在 deploy-impress.sh（helm 部署 impress）之前跑，让 backend 的 migrate 能连上库。
#
# 设计对齐（同 meet 那套：postgres:16-alpine / redis:7-alpine / hostPath 单机持久化）：
#   deploy/k8s_deploy/postgresql-deploy.yaml、redis-deploy.yaml（meet 仓库）
#
# ⚠️ Service 名字是刻意起的，必须与 docs.values.yaml 里已写死的库地址逐字符一致：
#     PG    postgres-docs-postgresql.docs.svc.cluster.local   → Service.name = postgres-docs-postgresql
#     Redis redis-docs-master.docs.svc.cluster.local          → Service.name = redis-docs-master
#   （名字沿用上游 bitnami-helm 风格，改这里就得同步改 docs.values.yaml 的 DB_HOST / REDIS_URL）
#
# 持久化：hostPath（单节点 k3s，数据落在本机 /data/docs/*，备份直接打包该目录）。
#   ⚠️ 单机方案：删 Pod 不丢数据，但重装系统/换盘前务必先备份 /data/docs。
# 密码：${DOCS_DB_PASSWORD} / ${DOCS_REDIS_PASSWORD} 由 secrets.env 经 envsubst 注入，明文不入库。
# ---------------------------------------------------------------------------
---
# ============ PostgreSQL（Docs 专属）============
apiVersion: v1
kind: Secret
metadata:
  name: postgres-docs-secret
  namespace: docs
type: Opaque
stringData:
  password: "${DOCS_DB_PASSWORD}"        # == secrets.env DOCS_DB_PASSWORD（app 侧 DB_PASSWORD 同值）
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-docs
  namespace: docs
  labels:
    app: postgres-docs
spec:
  replicas: 1
  strategy:
    type: Recreate                        # 单机 hostPath：不能两个 Pod 同挂同目录，禁止滚动并存
  selector:
    matchLabels:
      app: postgres-docs
  template:
    metadata:
      labels:
        app: postgres-docs
    spec:
      containers:
      - name: postgresql
        image: postgres:16-alpine
        env:
        - name: POSTGRES_DB
          value: impress                  # == docs.values.yaml DB_NAME
        - name: POSTGRES_USER
          value: dinum                     # == docs.values.yaml DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-docs-secret
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "dinum", "-d", "impress"]
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "dinum", "-d", "impress"]
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: data
        hostPath:
          path: /data/docs/postgresql
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-docs-postgresql          # ⚠️ 名字锁定：docs.values.yaml DB_HOST 依赖此 DNS
  namespace: docs
spec:
  selector:
    app: postgres-docs
  ports:
  - port: 5432
    targetPort: 5432
---
# ============ Redis（Docs 专属）============
apiVersion: v1
kind: Secret
metadata:
  name: redis-docs-secret
  namespace: docs
type: Opaque
stringData:
  redis-password: "${DOCS_REDIS_PASSWORD}"  # == secrets.env DOCS_REDIS_PASSWORD（进 redis:// URL，须纯 hex）
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-docs
  namespace: docs
  labels:
    app: redis-docs
spec:
  replicas: 1
  strategy:
    type: Recreate                        # 同 PG：单机 hostPath 禁止并存
  selector:
    matchLabels:
      app: redis-docs
  template:
    metadata:
      labels:
        app: redis-docs
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command:
        - redis-server
        - --requirepass
        - $(REDIS_PASSWORD)                # k8s 展开（非 envsubst），密码不进明文 command
        - --appendonly
        - "yes"
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-docs-secret
              key: redis-password
        ports:
        - containerPort: 6379
        readinessProbe:
          exec:
            command: ["sh", "-c", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["sh", "-c", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        hostPath:
          path: /data/docs/redis
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: redis-docs-master                 # ⚠️ 名字锁定：docs.values.yaml REDIS_URL 依赖此 DNS
  namespace: docs
spec:
  selector:
    app: redis-docs
  ports:
  - port: 6379
    targetPort: 6379
